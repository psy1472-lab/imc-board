name: Production Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "backend/scripts/production_smoke_public.py"
      - "backend/scripts/smoke_production_uat.py"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install httpx
      - name: Public production smoke
        env:
          PRODUCTION_API: https://imc-dashboard-api-production-2929.up.railway.app
          PRODUCTION_VERCEL: https://frontend-flame-tau-97.vercel.app
        run: |
          python scripts/production_smoke_public.py \
            --api "$PRODUCTION_API" \
            --vercel "$PRODUCTION_VERCEL"

      - name: Admin production smoke
        env:
          PRODUCTION_API: https://imc-dashboard-api-production-2929.up.railway.app
          PRODUCTION_VERCEL: https://frontend-flame-tau-97.vercel.app
          IMC_ADMIN_PASSWORD: ${{ secrets.IMC_ADMIN_PASSWORD }}
        run: |
          if [ -z "$IMC_ADMIN_PASSWORD" ]; then
            echo "Skipping admin smoke (IMC_ADMIN_PASSWORD secret not configured)"
            exit 0
          fi
          python scripts/smoke_production_uat.py \
            --api "$PRODUCTION_API" \
            --vercel "$PRODUCTION_VERCEL" \
            --password "$IMC_ADMIN_PASSWORD"
