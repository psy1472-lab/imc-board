name: Production Smoke

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install httpx
      - name: Public production smoke
        env:
          PRODUCTION_API: https://imc-dashboard-api-production-2929.up.railway.app
          PRODUCTION_VERCEL: https://frontend-flame-tau-97.vercel.app
        run: |
          python - <<'PY'
          import os
          import sys
          import httpx

          api = os.environ["PRODUCTION_API"].rstrip("/")
          vercel = os.environ["PRODUCTION_VERCEL"].rstrip("/")
          failures = []

          with httpx.Client(timeout=30.0) as client:
              for label, base in [("railway", api), ("vercel", vercel)]:
                  health = client.get(f"{base}/api/health")
                  body = health.json()
                  if health.status_code != 200 or body.get("status") != "ok":
                      failures.append(f"{label} health failed")
                  elif body.get("database", {}).get("reportCount", 0) < 1:
                      failures.append(f"{label} reportCount is zero")

              dates = client.get(f"{api}/api/reports/dates").json().get("dates", [])
              if not dates:
                  failures.append("no report dates")
              else:
                  latest = dates[-1]
                  summary = client.get(f"{api}/api/dashboard/summary", params={"date": latest})
                  kpis = summary.json().get("kpis", [])
                  total = next((k for k in kpis if k.get("key") == "total_volume"), None)
                  if summary.status_code != 200 or not total or total.get("value") is None:
                      failures.append(f"summary missing total_volume for {latest}")

              periods = client.get(f"{api}/api/operation-periods").json().get("periods", [])
              if not periods:
                  failures.append("operation periods not configured")

          if failures:
              print("FAIL:", "; ".join(failures))
              sys.exit(1)
          print("PASS: production smoke")
          PY

      - name: Admin smoke (optional)
        if: ${{ secrets.IMC_ADMIN_PASSWORD != '' }}
        env:
          PRODUCTION_API: https://imc-dashboard-api-production-2929.up.railway.app
          IMC_ADMIN_PASSWORD: ${{ secrets.IMC_ADMIN_PASSWORD }}
        run: python scripts/smoke_production_uat.py --password "$IMC_ADMIN_PASSWORD"
